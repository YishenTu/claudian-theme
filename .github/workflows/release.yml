name: Release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: test "$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" theme.css manifest.json --title "$GITHUB_REF_NAME" --generate-notes
